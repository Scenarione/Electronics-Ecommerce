services:
  postgres_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-parts_store}
      POSTGRES_USER: ${POSTGRES_USER:-parts}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
  mongo_db:
    image: mongo:7.0
    ports: ["127.0.0.1:27017:27017"]
    volumes: ["mongo_data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-parts}:${POSTGRES_PASSWORD:-local-development-only}@postgres_db:5432/${POSTGRES_DB:-parts_store}
      MONGO_URL: mongodb://mongo_db:27017
      MONGO_DB: parts_store
      APP_ENV: ${APP_ENV:-development}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-LocalAdmin123!}
      SEED_CUSTOMER_PASSWORD: ${SEED_CUSTOMER_PASSWORD:-LocalCustomer123!}
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres_db: {condition: service_healthy}
      mongo_db: {condition: service_healthy}
    command: ["sh", "-c", "alembic upgrade head && python -m app.catalog_setup && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
  mongo_data:
